<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prime Video Speed Controller</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Playback speed</h1>
      <output id="rate-readout" class="readout" for="rate-slider">1.0&times;</output>
    </header>

    <!--
      min, max, and step are set again from shared/rate.js at startup, which is the
      authoritative definition; the attributes here only avoid a flash of the wrong
      bounds before the script runs.
    -->
    <input
      id="rate-slider"
      class="slider"
      type="range"
      min="0.1"
      max="4"
      step="0.05"
      value="1"
      aria-label="Playback speed"
      aria-valuetext="1.0&times;"
    />

    <div class="scale" aria-hidden="true">
      <span>0.1&times;</span>
      <span>2.0&times;</span>
      <span>4.0&times;</span>
    </div>

    <div class="presets" id="presets" role="group" aria-label="Speed presets">
      <button type="button" class="preset" data-rate="0.5">0.5&times;</button>
      <button type="button" class="preset" data-rate="1">1&times;</button>
      <button type="button" class="preset" data-rate="1.25">1.25&times;</button>
      <button type="button" class="preset" data-rate="1.5">1.5&times;</button>
      <button type="button" class="preset" data-rate="1.75">1.75&times;</button>
      <button type="button" class="preset" data-rate="2">2&times;</button>
      <button type="button" class="preset" data-rate="2.5">2.5&times;</button>
      <button type="button" class="preset" data-rate="3">3&times;</button>
    </div>

    <p id="status" class="status" role="status">Checking this tab&hellip;</p>

    <script src="../shared/rate.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
